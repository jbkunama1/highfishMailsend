services:
  mail:
    image: ghcr.io/jbkunama1/highfishmailsend:latest
    restart: unless-stopped
    networks:
      - highfishNetwork
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8095}:8000'
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?Set a random token of at least 32 characters}
      MAIL_FROM: ${MAIL_FROM:?Set sender email}
      MAIL_TO: ${MAIL_TO:?Set default recipient email}
      MAIL_ALLOWED_TO: ${MAIL_ALLOWED_TO:-}
      DRY_RUN: ${DRY_RUN:-true}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailersend.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
      CYBERPANEL_API_KEY: ${CYBERPANEL_API_KEY:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?Set allowed server IP or hostname with external port e.g. 192.168.1.10:8095}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  highfishNetwork:
    external: true
    name: highfishNetwork
