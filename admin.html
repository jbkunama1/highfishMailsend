<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>highfishMailsend Admin</title>
<style>body{font:16px system-ui;background:#101827;color:#edf3ff;margin:auto;max-width:1000px;padding:24px}section{background:#1c2940;padding:24px;border-radius:16px;margin:18px 0}input,textarea,select,button{box-sizing:border-box;font:inherit;border-radius:8px;padding:12px;border:1px solid #61728f}input,textarea,select{display:block;width:100%;margin:8px 0 16px;background:#101827;color:white}button{background:#62d6c8;color:#10202b;cursor:pointer;margin:5px}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bdcce4}</style>
<h1>highfishMailsend</h1><section><label for="key">MCP-/Admin-Key</label><input id="key" type="password" autocomplete="off"><button id="login">Verbinden / Aktualisieren</button><button id="logout">Abmelden</button><p><small>Key nur im Seitenspeicher. HTTP ist unverschluesselt.</small></p></section>
<section><h2>Status</h2><pre id="status">Nicht verbunden.</pre><button id="dry">Testmodus einschalten</button></section>
<section><h2>Mail erstellen</h2><label for="transport">Versandweg</label><select id="transport"><option value="">Aktuellen Standard verwenden</option><option value="cyberpanel">CyberPanel API</option><option value="smtp">SMTP</option></select><label for="scope">Gilt fuer</label><select id="scope"><option value="once">Nur diese Mail</option><option value="all">Alle ab jetzt (global bis Neustart)</option></select><small>Standardaenderung gilt fuer neue Mails ueber Web, Telegram und MCP. Bestehende Entwuerfe bleiben unveraendert.</small><label for="sender">Absendername vor @ (leer = Standard)</label><input id="sender" maxlength="64"><p>Feste Domain: <span id="domain">Nach Anmeldung sichtbar</span></p><label for="to">Empfaenger (leer = Standard)</label><input id="to" type="email"><label for="subject">Betreff</label><input id="subject" maxlength="200"><label for="text">Mailtext</label><textarea id="text" rows="8" maxlength="100000"></textarea><button id="preview">Auswahl uebernehmen und Vorschau</button><pre id="draft"></pre><button id="send" disabled>Vorschau bestaetigen und senden</button><pre id="result" role="status"></pre></section>
<script>
let token='',draftId=null;const el=id=>document.getElementById(id);
async function api(action,data){if(!token)throw Error('Zuerst verbinden');const r=await fetch('/admin/api/'+action,{method:data===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data),cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Anfrage fehlgeschlagen');return j}
function invalidate(){draftId=null;el('send').disabled=true;el('draft').textContent=''}
function showStatus(j){el('status').textContent=JSON.stringify(j,null,2);el('domain').textContent='@'+j.sender_domain}
async function run(fn){try{await fn()}catch(e){el('result').textContent=e.message}}
el('login').onclick=()=>run(async()=>{if(el('key').value)token=el('key').value;el('key').value='';invalidate();showStatus(await api('status'));el('result').textContent='Verbunden.'});
el('logout').onclick=()=>{token='';el('key').value='';invalidate();el('status').textContent='Abgemeldet';el('domain').textContent='Nach Anmeldung sichtbar';el('result').textContent='';for(const id of ['sender','to','subject','text'])el(id).value='';el('transport').value='';el('scope').value='once'};
el('dry').onclick=()=>run(async()=>{if(confirm('Testmodus fuer alle Zugaenge bis Neustart einschalten?')){showStatus(await api('dryrun',{}));invalidate()}});
for(const id of ['sender','to','subject','text','transport','scope']){el(id).oninput=invalidate;el(id).onchange=invalidate}
el('preview').onclick=()=>run(async()=>{invalidate();const chosen=el('transport').value;const j=await api('preview',{sender:el('sender').value,to:el('to').value,subject:el('subject').value,text:el('text').value,transport:chosen});if(el('scope').value==='all'){if(!chosen)throw Error('Fuer Alle ab jetzt SMTP oder CyberPanel explizit waehlen');if(!confirm('Globalen Standard auf '+chosen+' fuer neue Mails aller Zugaenge bis Neustart setzen? Kein automatischer Versand.'))return;showStatus(await api('default',{transport:chosen,confirm:true}));el('scope').value='once';el('result').textContent='Globaler Standard geaendert, bis Neustart.'}draftId=j.id;el('draft').textContent=(j.dry_run?'TESTMODUS: kein Versand':'LIVE: echter Versand')+'\nWeg: '+j.transport+'\nVon: '+j.from+'\nAn: '+j.to+'\nBetreff: '+j.subject+'\n\n'+j.text;el('send').disabled=false});
el('send').onclick=()=>run(async()=>{if(!draftId||!confirm('Genau diese Vorschau ueber den angezeigten Versandweg verarbeiten? LIVE verschickt eine echte Mail.'))return;const id=draftId;draftId=null;el('send').disabled=true;el('result').textContent=JSON.stringify(await api('send',{id}),null,2)});
</script></html>
